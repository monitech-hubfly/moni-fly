<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ Moní — Revisão Final</title>
<style>
  :root {
    --navy: #0C2633;
    --navy-light: #1a3d52;
    --green: #2F4A3A;
    --gold: #D4AD68;
    --gold-light: #f0d9a8;
    --earth: #4A3929;
    --bg: #f8f7f4;
    --white: #ffffff;
    --border: rgba(12,38,51,0.12);
    --text: #1a2730;
    --text-muted: #5a6872;
    --radius: 10px;
    --shadow: 0 2px 12px rgba(12,38,51,0.09);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.55; }

  /* ── Header ── */
  .site-header {
    background: var(--navy);
    color: white;
    padding: 28px 32px 24px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .site-header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.3px; }
  .site-header p { font-size: 0.82rem; opacity: 0.65; margin-top: 3px; }
  .header-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .badge-total {
    background: var(--gold);
    color: var(--navy);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
  }
  .search-bar {
    width: 100%;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    margin-top: 14px;
    background: rgba(255,255,255,0.12);
    color: white;
    outline: none;
  }
  .search-bar::placeholder { color: rgba(255,255,255,0.5); }
  .search-bar:focus { background: rgba(255,255,255,0.2); }

  /* ── Layout ── */
  .container { max-width: 900px; margin: 0 auto; padding: 28px 20px 60px; }

  /* ── Status bar ── */
  .status-bar {
    display: flex; gap: 10px; flex-wrap: wrap;
    margin-bottom: 24px;
    padding: 14px 18px;
    background: white;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    font-size: 0.82rem;
    color: var(--text-muted);
  }
  .status-item { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot-new { background: var(--green); }
  .dot-revised { background: var(--gold); }
  .dot-star { background: #e8854a; }

  /* ── Category section ── */
  .category-section { margin-bottom: 22px; }
  .cat-header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px;
    background: var(--white);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    box-shadow: var(--shadow);
    transition: background 0.15s;
  }
  .cat-header:hover { background: #f0ede8; }
  .cat-header.open { border-radius: var(--radius) var(--radius) 0 0; border-bottom-color: transparent; }
  .cat-icon { font-size: 1.4rem; width: 36px; text-align: center; }
  .cat-name { font-size: 1.05rem; font-weight: 700; color: var(--navy); flex: 1; }
  .cat-count {
    font-size: 0.75rem; font-weight: 700;
    background: var(--navy);
    color: white;
    padding: 3px 9px;
    border-radius: 20px;
    min-width: 26px;
    text-align: center;
  }
  .cat-revised .cat-count { background: var(--gold); color: var(--navy); }
  .cat-chevron { font-size: 0.9rem; color: var(--text-muted); transition: transform 0.2s; }
  .cat-header.open .cat-chevron { transform: rotate(180deg); }

  .cat-articles {
    background: var(--white);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    overflow: hidden;
    display: none;
    box-shadow: var(--shadow);
  }
  .cat-articles.open { display: block; }

  /* ── Article item ── */
  .article-item { border-bottom: 1px solid var(--border); }
  .article-item:last-child { border-bottom: none; }
  .article-q {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 15px 20px;
    cursor: pointer;
    transition: background 0.12s;
  }
  .article-q:hover { background: #faf9f7; }
  .article-q.open { background: #f4f1ec; }
  .q-icon { color: var(--gold); font-weight: 900; font-size: 1rem; margin-top: 1px; flex-shrink: 0; }
  .q-text { flex: 1; font-size: 0.92rem; font-weight: 600; color: var(--navy); line-height: 1.4; }
  .q-badges { display: flex; gap: 6px; align-items: center; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .badge {
    font-size: 0.68rem; font-weight: 700;
    padding: 2px 7px; border-radius: 10px;
    letter-spacing: 0.2px;
  }
  .badge-area { background: #eef2ff; color: #3b4fc4; }
  .badge-area.Juridico { background: #fdf3e7; color: #b35a00; }
  .badge-area.Operacoes { background: #edf7ee; color: #1b6b28; }
  .badge-area.Tecnologia { background: #edf4fd; color: #1855a8; }
  .badge-area.Financeiro { background: #f3f0fb; color: #6030b0; }
  .badge-area.Marketing { background: #fce9f0; color: #b02060; }
  .badge-star { background: #fff3eb; color: #c4571a; }
  .badge-revised { background: var(--gold-light); color: var(--earth); }
  .q-chevron { font-size: 0.8rem; color: var(--text-muted); transition: transform 0.2s; flex-shrink: 0; margin-top: 2px; }
  .article-q.open .q-chevron { transform: rotate(180deg); }

  /* ── Article body ── */
  .article-body { display: none; padding: 0 20px 20px 20px; }
  .article-body.open { display: block; }
  .resumo {
    background: #f6f4f0;
    border-left: 3px solid var(--gold);
    padding: 10px 14px;
    border-radius: 0 6px 6px 0;
    font-size: 0.85rem;
    color: var(--text);
    margin-bottom: 12px;
  }
  .resumo strong { display: block; font-size: 0.72rem; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .full-content {
    font-size: 0.82rem;
    color: var(--text-muted);
    line-height: 1.6;
  }
  .full-content h2, .full-content h3 { color: var(--navy); margin-top: 12px; margin-bottom: 6px; font-size: 0.88rem; }
  .full-content table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 0.8rem; }
  .full-content th { background: var(--navy); color: white; padding: 6px 10px; text-align: left; font-weight: 600; }
  .full-content td { padding: 5px 10px; border-bottom: 1px solid var(--border); }
  .full-content tr:nth-child(even) td { background: rgba(12,38,51,0.03); }
  .full-content ul, .full-content ol { padding-left: 20px; margin: 6px 0; }
  .full-content li { margin-bottom: 3px; }
  .full-content blockquote {
    border-left: 3px solid var(--gold);
    margin: 10px 0;
    padding: 8px 12px;
    background: #fdfbf7;
    border-radius: 0 6px 6px 0;
    font-style: italic;
    color: var(--text);
  }
  .full-content code { background: #eee; padding: 1px 4px; border-radius: 3px; font-family: monospace; font-size: 0.95em; }
  .keywords-row {
    margin-top: 10px;
    display: flex; flex-wrap: wrap; gap: 5px;
  }
  .kw {
    font-size: 0.7rem;
    background: #eef0f3;
    color: var(--text-muted);
    padding: 2px 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .show-full-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 14px;
    font-size: 0.78rem;
    color: var(--navy);
    cursor: pointer;
    margin-bottom: 8px;
    transition: background 0.1s;
  }
  .show-full-btn:hover { background: #f0ede8; }
  .full-expanded { display: none; }
  .full-expanded.show { display: block; }

  /* ── Filters ── */
  .filter-row {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .filter-btn {
    font-size: 0.78rem; font-weight: 600;
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: white;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn.active { background: var(--navy); color: white; border-color: var(--navy); }
  .filter-btn:hover { background: #eee; }
  .filter-btn.active:hover { background: var(--navy-light); }

  /* ── Empty state ── */
  .empty-state { text-align: center; padding: 40px; color: var(--text-muted); display: none; }
  .empty-state.show { display: block; }

  /* ── Highlight search ── */
  mark { background: #fff3c4; border-radius: 2px; padding: 0 2px; }

  /* ── Revised badge on category ── */
  .badge-revised-cat {
    font-size: 0.68rem; font-weight: 700;
    background: var(--gold-light); color: var(--earth);
    padding: 2px 8px; border-radius: 10px;
  }
</style>
</head>
<body>

<div class="site-header">
  <div class="header-row">
    <div>
      <h1>FAQ Moní — Revisão Final 2026</h1>
      <p>Pré-visualização completa antes de aplicar no banco. DEV → PROD somente com confirmação.</p>
    </div>
    <span class="badge-total">41 artigos · 10 categorias</span>
  </div>
  <input class="search-bar" type="text" id="searchInput" placeholder="Buscar por pergunta, palavra-chave ou categoria..." oninput="filterContent(this.value)">
</div>

<div class="container">

  <div class="status-bar">
    <span class="status-item"><span class="dot dot-new"></span>39 artigos novos</span>
    <span class="status-item"><span class="dot dot-revised"></span>2 artigos revisados (Contratos e Garantias + Permuta)</span>
    <span class="status-item"><span class="dot dot-star"></span>11 artigos em destaque</span>
    <span style="margin-left:auto;font-size:0.78rem">Gerado em 17/09/2026</span>
  </div>

  <div class="filter-row" id="filterRow">
    <button class="filter-btn active" onclick="setFilter('all', this)">Todas as categorias</button>
    <button class="filter-btn" onclick="setFilter('destaque', this)">⭐ Destaque</button>
    <button class="filter-btn" onclick="setFilter('revisado', this)">🔄 Revisados</button>
  </div>

  <div id="categoriesContainer"></div>
  <div class="empty-state" id="emptyState">Nenhum artigo encontrado.</div>
</div>

<script>
const data = [
  {
    id: "terrenos",
    nome: "Terrenos",
    icon: "🏗️",
    tipo: "new",
    artigos: [
      {
        pergunta: "Quais são os critérios mínimos para um terreno ser considerado elegível pela Moní?",
        resumida: "O terreno deve estar em área urbana consolidada, ter acesso a rua pavimentada, frente mínima de 12m, área a partir de 300m², topografia viável para construção e documentação regularizada (matrícula limpa ou sanável).",
        completa: `## Critérios mínimos de elegibilidade de terreno

A Moní utiliza uma matriz de elegibilidade técnica e jurídica para avaliar se um terreno pode entrar no processo de permuta. Os critérios abaixo são verificados na fase de **Pré-Batalha** (Step One).

### Critérios técnicos

| Critério | Mínimo exigido |
|----------|----------------|
| Área total | ≥ 300 m² |
| Frente para logradouro | ≥ 12 m |
| Acesso | Rua pavimentada ou com pavimentação prevista |
| Topografia | Sem corte excessivo (declividade até 15%) |
| Zoneamento | Residencial unifamiliar ou multifamiliar de baixa densidade |

### Critérios jurídicos

- Matrícula atualizada no Cartório de Registro de Imóveis
- Ausência de ônus reais impeditivos (hipoteca, usufruto ativo, penhora não sanável)
- Proprietário capaz e com poder de disposição
- IPTU em dia (ou acordo formalizado)

### Sobre a documentação

Pendências jurídicas **não eliminam automaticamente** o terreno — o Jurídico Moní avalia caso a caso a viabilidade de saneamento.

> **Importante:** a elegibilidade definitiva é validada após o BCA e a aprovação do Comitê interno.`,
        area: "Operações",
        destaque: true,
        palavras: ["critérios terreno","elegibilidade terreno","área mínima","frente mínima","documentação terreno","matrícula"]
      },
      {
        pergunta: "Como funciona a prospecção de terrenos no modelo Moní?",
        resumida: "O franqueado é o responsável pela prospecção ativa de terrenos em seu território. Ele identifica oportunidades, apresenta ao terrenista o modelo Moní e, se houver interesse, cadastra o lead no Hub Fly para iniciar o funil Step One.",
        completa: `## Prospecção de terrenos — papel do franqueado

No modelo Moní, a **prospecção de terrenos** é responsabilidade do franqueado.

### Fluxo de prospecção

1. **Identificação:** franqueado mapeia terrenos no seu território por zoneamento, visitas, indicações e pesquisa imobiliária
2. **Abordagem:** apresenta o modelo de permuta Moní ao terrenista
3. **Qualificação:** verifica critérios básicos de elegibilidade (área, frente, documentação)
4. **Cadastro no Hub Fly:** abre card no Funil Step One com dados do terreno e terrenista
5. **Análise Moní:** time interno valida viabilidade técnica, jurídica e financeira
6. **Apresentação formal:** BCA e reunião com o terrenista

### Ferramentas de apoio

- **Mapa de Competidores** (etapa Step One): levantamento de oferta residencial na região
- **Configurador de Casas**: simulação de viabilidade antes da proposta
- **Material de apresentação Moní**: disponível no Hub Fly > Repositório

> **Dúvidas sobre abordagem ao terrenista?** Consulte o material de Sales Enablement no Repositório ou abra chamado no Sirene.`,
        area: "Operações",
        destaque: false,
        palavras: ["prospecção terreno","funil step one","terrenista","território franqueado","mapa competidores","lead terreno"]
      },
      {
        pergunta: "O que é o BCA e como ele avalia a viabilidade do terreno?",
        resumida: "O BCA (Business Case Analysis) é o documento técnico-financeiro que valida se a permuta é viável para todos os lados. Ele considera VGV, custo de obra, parcela de permuta, margem da Moní e retorno ao terrenista. É gerado no Step One e apresentado no Comitê.",
        completa: `## BCA — Business Case Analysis

O BCA é o **documento de viabilidade econômica** que resume se um negócio Moní deve avançar para contrato.

### O que o BCA calcula

| Componente | Descrição |
|------------|----------|
| **VGV (Valor Geral de Vendas)** | Receita total estimada com a venda das casas |
| **Custo de obra** | Estimativa de construção por m² × unidades |
| **Permuta ao terrenista** | Número e tipologia de unidades que serão entregues |
| **Margem operacional** | Retorno esperado para a Moní |
| **Cronograma financeiro** | Estimativa de desembolso e retorno por fase |

### Resultado do BCA

- **BCA aprovado:** negócio avança para fase de contrato (Portfolio)
- **BCA reprovado:** negócio encerrado ou renegociado
- **BCA condicional:** aprovado com ajuste de número de casas ou formato de permuta

> **Importante:** o BCA é uma estimativa; valores definitivos são validados no Acoplamento (modelagem financeira final com o Gbox).`,
        area: "Operações",
        destaque: true,
        palavras: ["BCA","business case analysis","viabilidade terreno","VGV","permuta casas","comitê","modelo financeiro"]
      },
      {
        pergunta: "Quais certidões e documentos o terrenista precisa apresentar?",
        resumida: "O terrenista deve apresentar matrícula atualizada, IPTU quitado, certidões negativas de débito (Receita Federal, FGTS, Estadual, Municipal), certidão de ônus reais, documentos pessoais e, se pessoa jurídica, contrato social e CNPJ regularizado.",
        completa: `## Documentação do terrenista — checklist completo

### Documentos do imóvel
- Matrícula atualizada (emitida há no máximo 30 dias)
- Certidão de ônus reais
- Certidão de propriedade e de transmissão
- IPTU quitado (últimos 5 anos)

### Certidões do proprietário (pessoa física)
- RG e CPF
- Comprovante de estado civil
- Certidão negativa de débitos — Receita Federal (CPF)
- Certidão negativa de débitos — FGTS
- Certidões negativas estadual e municipal
- Certidão de distribuição de ações cíveis

### Certidões extras — pessoa jurídica
- Contrato social ou estatuto atualizado
- CNPJ regularizado na Receita Federal
- Certidão de regularidade FGTS (CNPJ da empresa)

> **Dúvida sobre documentação específica?** Abra um chamado no Sirene → área Jurídico.`,
        area: "Jurídico",
        destaque: false,
        palavras: ["certidões terrenista","documentos terreno","matrícula","certidão negativa","checklist terrenista"]
      },
      {
        pergunta: "O que pode desqualificar um terreno no processo Moní?",
        resumida: "Terrenos em área de preservação permanente, com litigância judicial grave, localização fora do zoneamento residencial, topografia inviável, acesso exclusivo por servidão não regularizada ou com pendências jurídicas insanáveis no prazo do projeto são os principais motivos de desqualificação.",
        completa: `## Fatores de desqualificação de terreno

### Desqualificadores técnicos

| Fator | Motivo |
|-------|--------|
| Área de Preservação Permanente (APP) | Não pode ser construído (Código Florestal) |
| Zoneamento não residencial | Licença de obra residencial negada pela prefeitura |
| Declividade > 25% | Inviabilidade construtiva e financeira |
| Área < 300 m² ou frente < 10 m | Não comporta projeto-padrão Moní |

### Desqualificadores jurídicos

| Fator | Motivo |
|-------|--------|
| Litígio judicial em fase avançada (penhora, arresto) | Impede alienação ou oneração |
| Inventário em curso sem prazo de conclusão | Bloqueia a assinatura do contrato |
| Débitos com valor superior ao VGV previsto | Inviabilidade econômica |

### Situações analisadas caso a caso
- **Meação:** cônjuge pode ser incluído — não desqualifica, mas exige anuência
- **Múltiplos proprietários:** possível com todas as assinaturas
- **Hipoteca:** pode ser quitada com parte do negócio`,
        area: "Operações",
        destaque: false,
        palavras: ["desqualificação terreno","terreno inviável","app preservação permanente","zoneamento","litígio imóvel"]
      },
      {
        pergunta: "O que é o Comunicado de Uso e como ele afeta a prospecção?",
        resumida: "O Comunicado de Uso é o documento que define o território de atuação do franqueado, incluindo restrições de sobreposição com outras franquias. Prospectar fora do território ou em área com exclusividade de outro franqueado viola o COF e deve ser consultado antes de qualquer abordagem.",
        completa: `## Comunicado de Uso — território e restrições

O **Comunicado de Uso** faz parte da Circular de Oferta de Franquia (COF) e delimita onde o franqueado pode prospectar e operar sem conflito com outras unidades Moní.

### O que ele define
- **Território exclusivo:** área geográfica primária do franqueado
- **Área de influência:** zona secundária onde a atuação é permitida mas sem exclusividade
- **Restrições:** localizações onde outro franqueado tem prioridade

### Como consultar
- O mapa de territórios está disponível no Hub Fly > Repositório > COF e Contratos
- Em caso de sobreposição, acione o Sirene → área Operações

### Consequências do descumprimento
Prospectar em território de outro franqueado caracteriza **infração contratual** e pode resultar em advertência, mediação obrigatória ou rescisão de contrato.

> **Sempre consulte o mapa de territórios antes de iniciar uma prospecção nova.**`,
        area: "Jurídico",
        destaque: false,
        palavras: ["comunicado de uso","território franqueado","COF","exclusividade territorio","sobreposição franquias"]
      }
    ]
  },
  {
    id: "aprovacoes",
    nome: "Aprovações e Pré-Obra",
    icon: "📋",
    tipo: "new",
    artigos: [
      {
        pergunta: "O que é o Projeto Legal e qual é o papel do franqueado nessa etapa?",
        resumida: "O Projeto Legal é o conjunto de documentos técnicos (planta, memorial descritivo, ART/RRT) submetido à prefeitura para aprovação da construção. O franqueado acompanha o andamento via Hub Fly; a execução técnica é responsabilidade do time de Projetos da Moní.",
        completa: `## Projeto Legal — o que é e quem faz

| Responsável | Atividade |
|-------------|----------|
| **Time Projetos Moní** | Elabora e assina o projeto (plantas, memorial, ART/RRT) |
| **Prefeitura** | Analisa e aprova (ou solicita adequações) |
| **Franqueado** | Acompanha status no Hub Fly |
| **Condomínio** | Aprova internamente (em alguns casos) |

### Fases do Projeto Legal no Hub Fly
1. **Nova demanda** — projeto criado pelo time Operações
2. **Em elaboração** — equipe prepara documentação
3. **Aguardando aprovação condomínio** — síndico analisa
4. **Submetido à prefeitura** — protocolo registrado
5. **Em análise** — prazo varia por município (15–90 dias úteis)
6. **Aprovado** — alvará de construção emitido

> **Prazo médio:** 30–90 dias úteis dependendo do município.`,
        area: "Operações",
        destaque: true,
        palavras: ["projeto legal","aprovação prefeitura","planta obra","ART","RRT","memorial descritivo","funil projeto legal"]
      },
      {
        pergunta: "Como funciona a aprovação pelo condomínio e qual é o prazo típico?",
        resumida: "A aprovação do condomínio é obtida junto ao síndico ou administradora antes da submissão à prefeitura. O franqueado é o responsável por facilitar essa comunicação. O prazo típico é de 15 a 30 dias.",
        completa: `## Aprovação pelo condomínio

### Processo típico
1. Franqueado apresenta o projeto ao síndico ou administradora
2. Assembleia ou reunião de diretoria analisa e vota
3. Documento de anuência emitido pelo condomínio
4. Time Projetos Moní inclui anuência no processo de aprovação municipal

### Prazos

| Situação | Prazo estimado |
|----------|----------------|
| Aprovação por reunião de diretoria | 7–15 dias |
| Aprovação por assembleia convocada | 20–45 dias |
| Condomínio com regras rígidas | 30–60 dias |

> **Atenção:** qualquer compromisso de alteração no projeto com o condomínio deve ser comunicado ao time Projetos antes de ser firmado.`,

let currentFilter = 'all';
let currentSearch = '';

function badgeArea(area) {
  const clean = area.replace(/\s+/g,'');
  return `<span class="badge badge-area ${clean}">${area}</span>`;
}

function renderMarkdown(text) {
  return text
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^\| (.+) \|$/gm, row => {
      const cells = row.trim().split('|').slice(1,-1);
      if (cells.every(c => /^[\s\-:]+$/.test(c))) return '';
      const isHeader = row.includes('**') || false;
      return '<tr>' + cells.map(c => `<td>${c.trim().replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}</td>`).join('') + '</tr>';
    })
    .replace(/(<tr>[\s\S]*?<\/tr>)/g, match => {
      if (match.includes('<td>') && !match.includes('<th>')) return match;
      return match;
    })
    .replace(/(\<tr\>.*\<\/tr\>(\n\<tr\>.*\<\/tr\>)*)/g, m => `<table><tbody>${m}</tbody></table>`)
    .replace(/^\- \[x\] (.+)$/gm, '<li>✅ $1</li>')
    .replace(/^\- \[ \] (.+)$/gm, '<li>☐ $1</li>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>(\n<li>.*<\/li>)*)/g, m => `<ul>${m}</ul>`)
    .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/\n\n/g, '<br>')
    .replace(/\n/g, ' ');
}

function highlight(text, query) {
  if (!query) return text;
  const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

function matchesFilter(cat, art) {
  if (currentFilter === 'destaque') return art.destaque;
  if (currentFilter === 'revisado') return cat.tipo === 'revised';
  return true;
}

function matchesSearch(cat, art, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  return (
    art.pergunta.toLowerCase().includes(q) ||
    art.resumida.toLowerCase().includes(q) ||
    cat.nome.toLowerCase().includes(q) ||
    (art.palavras && art.palavras.some(p => p.toLowerCase().includes(q)))
  );
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
}

function filterContent(query) {
  currentSearch = query;
  renderAll();
}

function renderAll() {
  const container = document.getElementById('categoriesContainer');
  container.innerHTML = '';
  let anyVisible = false;
  const q = currentSearch.trim();

  data.forEach(cat => {
    const filteredArts = cat.artigos.filter(art => matchesFilter(cat, art) && matchesSearch(cat, art, q));
    if (filteredArts.length === 0) return;
    anyVisible = true;

    const sec = document.createElement('div');
    sec.className = 'category-section';
    sec.dataset.catId = cat.id;

    const header = document.createElement('div');
    header.className = `cat-header${cat.tipo === 'revised' ? ' cat-revised' : ''}`;
    header.innerHTML = `
      <span class="cat-icon">${cat.icon}</span>
      <span class="cat-name">${highlight(cat.nome, q)}</span>
      ${cat.tipo === 'revised' ? '<span class="badge-revised-cat">🔄 Revisado</span>' : ''}
      <span class="cat-count">${filteredArts.length}</span>
      <span class="cat-chevron">▼</span>
    `;

    const artBody = document.createElement('div');
    artBody.className = 'cat-articles';

    filteredArts.forEach((art, idx) => {
      const item = document.createElement('div');
      item.className = 'article-item';

      const qBadges = [
        badgeArea(art.area),
        art.destaque ? '<span class="badge badge-star">⭐ Destaque</span>' : '',
        art.revisado ? '<span class="badge badge-revised">🔄 Revisado</span>' : ''
      ].filter(Boolean).join('');

      const qRow = document.createElement('div');
      qRow.className = 'article-q';
      qRow.innerHTML = `
        <span class="q-icon">Q</span>
        <span class="q-text">${highlight(art.pergunta, q)}</span>
        <div class="q-badges">${qBadges}</div>
        <span class="q-chevron">▼</span>
      `;

      const body = document.createElement('div');
      body.className = 'article-body';

      const kwHtml = (art.palavras || []).map(k => `<span class="kw">${highlight(k, q)}</span>`).join('');

      body.innerHTML = `
        <div class="resumo"><strong>Resposta Resumida</strong>${highlight(art.resumida, q)}</div>
        <button class="show-full-btn" onclick="toggleFull(this)">▶ Ver resposta completa</button>
        <div class="full-expanded full-content">${renderMarkdown(art.completa)}</div>
        ${kwHtml ? `<div class="keywords-row">${kwHtml}</div>` : ''}
      `;

      qRow.onclick = () => {
        qRow.classList.toggle('open');
        body.classList.toggle('open');
      };

      item.appendChild(qRow);
      item.appendChild(body);
      artBody.appendChild(item);
    });

    header.onclick = () => {
      header.classList.toggle('open');
      artBody.classList.toggle('open');
    };

    // Auto-open if searching or filtered
    if (q || currentFilter !== 'all') {
      header.classList.add('open');
      artBody.classList.add('open');
    }

    sec.appendChild(header);
    sec.appendChild(artBody);
    container.appendChild(sec);
  });

  document.getElementById('emptyState').classList.toggle('show', !anyVisible);
}

function toggleFull(btn) {
  const expanded = btn.nextElementSibling;
  const isOpen = expanded.classList.toggle('show');
  btn.textContent = isOpen ? '▼ Ocultar resposta completa' : '▶ Ver resposta completa';
}

renderAll();
</script>
</body>
</html>
