<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPIs Diretoria · Hub Fly — Cruzamento Estrito</title>

<style>
:root {
  --navy:   #0C2633;
  --green:  #2F4A3A;
  --earth:  #4A3929;
  --gold:   #D4AD68;
  --red:    #c0392b;
  --ok-txt: #1d3a27;
  --ok-bg:  #e4ede7;
  --nm-txt: #555;
  --nm-bg:  #f0f0f0;
  --pend-txt:#3a3a6a;
  --pend-bg: #e8e8f4;
  --bg:     #f2f1ef;
  --surf:   #fff;
  --bord:   rgba(0,0,0,0.09);
  --sw:     220px;
  --sans:   'Inter',system-ui,sans-serif;
  --disp:   'Georgia',serif;

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:#1a1a1a;font-size:13px}
a{color:inherit;text-decoration:none}

/* TOP BAR */
.topbar{
  position:sticky;top:0;z-index:100;
  background:var(--navy);color:#fff;
  display:flex;align-items:center;gap:12px;
  padding:0 24px;height:48px;
}
.topbar-logo{font-family:var(--disp);font-size:17px}
.topbar-sep{opacity:.3}
.topbar-title{font-size:12px;opacity:.6;letter-spacing:.3px;text-transform:uppercase}
.topbar-right{margin-left:auto;display:flex;gap:20px}
.tstat{font-size:11px;opacity:.85}
.tstat strong{font-size:15px;font-weight:700;margin-right:3px}

/* LAYOUT */
.layout{display:flex;min-height:calc(100vh - 48px)}
.sidebar{
  width:var(--sw);min-width:var(--sw);
  background:var(--navy);padding:20px 0;
  position:sticky;top:48px;height:calc(100vh - 48px);overflow-y:auto;
}
.sidebar a{
  display:block;padding:7px 18px;
  font-size:11px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;
  color:rgba(255,255,255,.5);transition:all .15s;
}
.sidebar a:hover,.sidebar a.active{color:#fff;background:rgba(255,255,255,.07)}
.sb-sec{
  padding:13px 18px 4px;font-size:9px;
  color:rgba(255,255,255,.25);letter-spacing:.9px;text-transform:uppercase;margin-top:4px;
}
.main{flex:1;padding:28px 28px 80px;overflow-x:hidden;max-width:1440px}

/* SUMMARY TABLE */
.sec-title{
  font-family:var(--disp);font-size:20px;color:var(--navy);margin-bottom:14px;
}
.sum-wrap{
  background:var(--surf);border:.5px solid var(--bord);
  border-radius:12px;overflow:hidden;margin-bottom:28px;
}
.sum-tbl{width:100%;border-collapse:collapse;font-size:12px}
.sum-tbl th{
  background:var(--navy);color:#fff;
  padding:9px 14px;text-align:left;font-weight:600;
  font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;
}
.sum-tbl th.r{text-align:right}
.sum-tbl td{padding:8px 14px;border-bottom:.5px solid var(--bord)}
.sum-tbl tr:last-child td{border-bottom:none;font-weight:700;background:#f8f8f6}
.sum-tbl tr:hover td{background:#f6f5f2}
.c-ok  {color:var(--ok-txt);font-weight:700}
.c-nm  {color:#888;font-weight:700}
.c-pd  {color:var(--pend-txt);font-style:italic}
td.r{text-align:right}
.bar-wrap{display:flex;height:7px;border-radius:4px;overflow:hidden;gap:1px;min-width:80px}
.bar-m{background:var(--green)}
.bar-nm{background:#ddd}

/* LEGENDA */
.legenda{
  display:flex;gap:18px;flex-wrap:wrap;
  background:var(--surf);border:.5px solid var(--bord);
  border-radius:10px;padding:11px 16px;margin-bottom:20px;font-size:11px;
}
.leg{display:flex;align-items:center;gap:6px}
.leg-bar{width:3px;height:16px;border-radius:2px;flex-shrink:0}

/* INFO */
.info-box{
  background:#e8e8f4;border:.5px solid #aac;
  border-radius:10px;padding:10px 15px;margin-bottom:24px;
  font-size:11.5px;color:var(--navy);line-height:1.65;
}
code{background:#dde8f0;padding:1px 5px;border-radius:3px;font-size:10.5px}

/* DEPTO */
.depto{margin-bottom:52px;scroll-margin-top:64px}
.depto-header{
  display:flex;align-items:baseline;gap:10px;
  margin-bottom:18px;padding-bottom:10px;
  border-bottom:.5px solid var(--bord);
}
.depto-name{font-family:var(--disp);font-size:23px;color:var(--navy)}
.depto-badge{font-size:11.5px;color:#aaa}

.divisao{margin-bottom:24px}
.div-title{
  font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
  color:#bbb;margin-bottom:10px;padding:3px 0;border-bottom:.5px solid var(--bord);
}

/* GRID */
.kpi-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:10px;
}

/* CARD */
.kpi-card{
  background:var(--surf);border:.5px solid var(--bord);
  border-radius:12px;padding:12px 12px 11px;
  display:flex;flex-direction:column;gap:6px;
  transition:border-color .15s;
}
.kpi-card:hover{border-color:rgba(0,0,0,.18)}
.kpi-card.c-mon{border-left:2.5px solid var(--green)}
.kpi-card.c-pnd{border-left:2.5px solid #aac}

/* BADGES */
.kpi-top{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tbadge{
  font-size:9px;font-weight:800;letter-spacing:.3px;
  padding:2px 6px;border-radius:4px;white-space:nowrap;flex-shrink:0;
}
.tN  {background:#e3ecf1;color:var(--navy)}
.tP  {background:#e4ede7;color:var(--green)}
.tFIN{background:#fdf6e8;color:#7a5a00;border:.5px solid var(--gold)}
.tH  {background:#ebebeb;color:#444}
.tNT {background:#ede9e5;color:var(--earth)}
.tTX {background:#ebebeb;color:#555}
.tOU {background:#f0f0f0;color:#888}

.sbadge{
  font-size:9px;font-weight:700;letter-spacing:.2px;
  padding:2px 8px;border-radius:20px;white-space:nowrap;
}
.sm{background:var(--ok-bg);color:var(--ok-txt)}    /* monitored */
.snm{background:var(--nm-bg);color:var(--nm-txt)}   /* not monitored */
.spd{background:var(--pend-bg);color:var(--pend-txt)} /* a definir */

/* KPI NOME */
.kpi-nome{font-size:13px;font-weight:700;color:#111;line-height:1.3;min-height:32px}

/* BLOCO HUB FLY */
.bloco-hub{
  background:#f2f7fb;border:.5px solid #cde0ee;
  border-radius:7px;padding:7px 9px;
  display:flex;flex-direction:column;gap:3px;
}
.bloco-hub .bh-row{
  display:flex;gap:5px;align-items:flex-start;font-size:10.5px;line-height:1.4;
}
.bh-label{
  font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:#5a8aaa;white-space:nowrap;flex-shrink:0;min-width:80px;
}
.bh-val{color:#0C2633;font-weight:600}
.bh-val.area{color:var(--green);font-weight:500}
.bh-val.como{color:#555;font-weight:400;font-style:italic}
.bh-sep{height:.5px;background:#d8eaf5;margin:2px 0}

/* BLOCO NÃO MONITORADO */
.bloco-nm{
  background:#f5f5f5;border:.5px solid #e0e0e0;
  border-radius:7px;padding:7px 9px;
}
.nm-title{
  font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:#aaa;margin-bottom:3px;
}
.nm-text{font-size:10.5px;color:#999;line-height:1.4;font-style:italic}

/* GRÁFICO */
.kpi-chart-wrap{height:65px;margin:2px 0 0}
.kpi-meta-info{font-size:9.5px;color:#c0392b;margin-top:1px;font-weight:600}

</head>

/* ── HELPERS ────────────────────────────────────────────────────────────── */
function tBadge(t){
  const M = {
    'N':['(n)','tN'], '%':['(%)','tP'], '$':['($)','tFIN'],
    'H':['(h)','tH'], '05':['(0-5)','tNT'], 'NOTA':['(nota)','tNT'],
    'NOME':['(nome)','tTX'], 'DATA':['(data)','tTX'],
    'LISTA':['(lista)','tTX'], 'DIAS':['(dias)','tTX'],
    '?':['(?)','tOU'], '—':['(—)','tOU'],
  };
  const [l,c] = M[t] || ['(?)','tOU'];
  return `<span class="tbadge ${c}">${l}</span>`;
}

  Cada KPI:
  tipo      → código do tipo (N, %, $, H, 05, NOTA, NOME, DATA, LISTA, DIAS, ?, —)

  excelArea → "DEPTO / DIVISÃO" conforme planilha

/* ── CONTAGENS ───────────────────────────────────────────────────────────── */
const SUM_ROWS = [
  {id:'mkt',      lbl:'MKT'},
  {id:'comercial',lbl:'COMERCIAL'},
  {id:'juridico', lbl:'JURÍDICO'},
  {id:'adm',      lbl:'ADM'},
  {id:'nn',       lbl:'NOVOS NEG.'},
  {id:'pool',     lbl:'POOL PROJ.'},
  {id:'supply',   lbl:'SUPPLY',   pendente:true},
  {id:'wayser',   lbl:'WAYSER'},
  {id:'produto',  lbl:'PRODUTO'},
  {id:'care',     lbl:'MONÍ CARE'},
  {id:'mcapital', lbl:'M. CAPITAL'},
  {id:'imob',     lbl:'IMOB'},
];

function contar(id){
  const dep = DEPTOS.find(d=>d.id===id);
  if(!dep) return {t:0,m:0,nm:0};
  const kpis = dep.divisoes.flatMap(div=>div.kpis).filter(k=>k.tipo!=='—'||k.monitored);
  const kpisReal = dep.divisoes.flatMap(div=>div.kpis).filter(k=>!(k.tipo==='—'&&!k.monitored));
  return {
    t: kpisReal.length,
    m: kpisReal.filter(k=>k.monitored).length,
    nm: kpisReal.filter(k=>!k.monitored).length,
  };
}

/* ── SIDEBAR ──────────────────────────────────────────────────────────────── */
function renderSidebar(){
  const groups = [
    {lbl:'Principal', ids:['mkt','comercial','juridico','adm','nn']},
    {lbl:'Operações', ids:['pool','supply','wayser','produto']},
    {lbl:'Negócios',  ids:['care','mcapital','imob']},
  ];
  let h='';
  groups.forEach(({lbl,ids})=>{
    h+=`<div class="sb-sec">${lbl}</div>`;
    ids.forEach(id=>{
      const d=DEPTOS.find(x=>x.id===id);
      if(d) h+=`<a href="#dep-${id}" data-id="${id}">${d.nome}</a>`;
    });
  });
  document.getElementById('sb').innerHTML=h;
}

/* ── MAIN ─────────────────────────────────────────────────────────────────── */
function renderMain(){
  /* topbar */
  let totM=0,totNM=0,totT=0;
  SUM_ROWS.forEach(r=>{
    if(r.pendente) return;
    const c=contar(r.id);
    totM+=c.m; totNM+=c.nm; totT+=c.t;
  });
  document.getElementById('tc').innerHTML=
    `<span class="tstat"><strong>${totT}</strong>KPIs</span>`+
    `<span class="tstat"><strong>${totM}</strong>monitorados</span>`+
    `<span class="tstat"><strong>${totNM}</strong>a criar/identificar</span>`;

  /* TABELA RESUMO */
  let rows='';
  let gT=0,gM=0,gNM=0;
  SUM_ROWS.forEach(r=>{
    if(r.pendente){
      rows+=`<tr><td><a href="#dep-${r.id}" style="color:var(--navy);font-weight:600">${r.lbl}</a></td>
        <td class="r" style="color:var(--pend-txt);font-style:italic">A definir</td>
        <td class="r">—</td><td class="r">—</td><td class="r">—</td><td></td></tr>`;
      return;
    }
    const c=contar(r.id);
    gT+=c.t; gM+=c.m; gNM+=c.nm;
    const pct=c.t>0?Math.round(c.m/c.t*100):0;
    const mW=c.t>0?Math.round(c.m/c.t*100):0;
    const nmW=100-mW;
    rows+=`<tr>
      <td><a href="#dep-${r.id}" style="color:var(--navy);font-weight:600">${r.lbl}</a></td>
      <td class="r">${c.t}</td>
      <td class="r c-ok">${c.m}</td>
      <td class="r c-nm">${c.nm}</td>
      <td class="r">${pct}%</td>
      <td style="min-width:90px">
        <div class="bar-wrap">
          <div class="bar-m" style="width:${mW}%"></div>
          <div class="bar-nm" style="width:${nmW}%"></div>
        </div>
      </td>
    </tr>`;
  });
  const gPct=gT>0?Math.round(gM/gT*100):0;
  rows+=`<tr>
    <td>TOTAL</td>
    <td class="r">${gT}</td>
    <td class="r c-ok">${gM}</td>
    <td class="r c-nm">${gNM}</td>
    <td class="r">${gPct}%</td>
    <td></td>
  </tr>`;

  /* CARDS */
  let cardsH='';
  DEPTOS.forEach(dep=>{
    const kpis=dep.divisoes.flatMap(d=>d.kpis).filter(k=>!(k.tipo==='—'&&!k.monitored));
    const nM=kpis.filter(k=>k.monitored).length;
    const nNM=kpis.filter(k=>!k.monitored).length;

    const avisoH=dep.avisoAlinhamento
      ?`<div style="background:#fff8e6;border:.5px solid var(--gold);border-radius:8px;padding:8px 13px;margin-bottom:14px;font-size:11px;color:#7a5a00;line-height:1.5"><strong style="color:var(--earth)">⚠ Alinhamento:</strong> ${dep.avisoAlinhamento}</div>`
      :'';

    cardsH+=`<div class="depto" id="dep-${dep.id}">
      <div class="depto-header">
        <span class="depto-name">${dep.nome}</span>
        <span class="depto-badge">${nM} monitorados · ${nNM} a criar/identificar</span>
      </div>
      ${avisoH}`;

    dep.divisoes.forEach((div,di)=>{
      cardsH+=`<div class="divisao">
        <div class="div-title">${div.nome}</div>
        <div class="kpi-grid">`;
      div.kpis.forEach((kpi,ki)=>{
        if(kpi.tipo==='—'&&!kpi.monitored&&kpi.criar){
          cardsH+=`<div class="kpi-card c-pnd" style="grid-column:1/-1">
            <div class="kpi-top">
              <span class="tbadge tOU">(—)</span>
              <span class="sbadge spd">◌ A Definir</span>
            </div>
            <div class="kpi-nome">${kpi.nome}</div>
            <div class="bloco-nm"><div class="nm-title">Situação</div><div class="nm-text">${kpi.criar}</div></div>
          </div>`;
          return;
        }

        const cid=`c-${dep.id}-${di}-${ki}`;
        const bordCls=kpi.monitored?'c-mon':'';
        const statusBadge=kpi.monitored
          ?`<span class="sbadge sm">● Monitorado</span>`
          :`<span class="sbadge snm">○ Não monitorado</span>`;

        /* bloco hub fly */
        let blocoH='';
        if(kpi.monitored && kpi.hub){
          blocoH=`<div class="bloco-hub">
            <div class="bh-row">
              <span class="bh-label">Área Excel</span>
              <span class="bh-val">${kpi.excelArea}</span>
            </div>
            <div class="bh-sep"></div>
            <div class="bh-row">
              <span class="bh-label">Área Hub Fly</span>
              <span class="bh-val area">${kpi.hub.area}</span>
            </div>
            <div class="bh-row">
              <span class="bh-label">Indicador</span>
              <span class="bh-val">${kpi.hub.indicador}</span>
            </div>
            <div class="bh-sep"></div>
            <div class="bh-row">
              <span class="bh-label">Como é preenchido</span>
              <span class="bh-val como">${kpi.hub.como}</span>
            </div>
          </div>`;
        } else {
          blocoH=`<div class="bloco-nm">
            <div class="nm-title">Não monitorado no Hub Fly hoje</div>
            <div class="nm-text">${kpi.criar||'—'}</div>
          </div>`;
        }

        /* gráfico com meta stepped vermelha */
        let chartH='';
        if(kpi.monitored && kpi.d && kpi.meta){
          const metaStepStr = JSON.stringify(kpi.meta);
          const metaInfo = `Meta: ${[...new Set(kpi.meta)].join(' → ')}`;
          chartH=`<div class="kpi-chart-wrap"><canvas id="${cid}" data-values='${JSON.stringify(kpi.d)}' data-meta='${metaStepStr}'></canvas></div>
            <div class="kpi-meta-info">${metaInfo}</div>`;
        }

        /* nota */
        const notaH=kpi.nota?`<div style="font-size:10px;color:#999;line-height:1.4;font-style:italic;margin-top:2px">${kpi.nota}</div>`:'';

        cardsH+=`<div class="kpi-card ${bordCls}">
          <div class="kpi-top">${tBadge(kpi.tipo)}${statusBadge}</div>
          <div class="kpi-nome">${kpi.nome}</div>
          ${blocoH}
          ${chartH}
          ${notaH}
        </div>`;
      });
      cardsH+=`</div></div>`;
    });
    cardsH+=`</div>`;
  });

  document.getElementById('main').innerHTML=`
  <h2 class="sec-title">Resumo por Área</h2>
  <div class="sum-wrap">
    <table class="sum-tbl">
      <thead>
        <tr>
          <th>Área</th>
          <th class="r">KPIs definidos</th>
          <th class="r">● Monitorado</th>
          <th class="r">○ A criar/identificar</th>
          <th class="r">Cobertura</th>
          <th>Distribuição</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  </div>

  <div class="legenda">
    <div class="leg"><div class="leg-bar" style="background:var(--green)"></div>
      <strong style="color:var(--ok-txt)">● Monitorado</strong> — existe indicador exato em TO DO &amp; PLANNING / Metas &amp; Indicadores</div>
    <div class="leg"><div class="leg-bar" style="background:#ddd"></div>
      <strong style="color:var(--nm-txt)">○ A criar/identificar</strong> — KPI não monitorado via Hub Fly hoje; requer criação ou identificação de fonte</div>
    <div class="leg"><div class="leg-bar" style="background:#aac"></div>
      <strong style="color:var(--pend-txt)">◌ A definir</strong> — área sem KPIs definidos pela diretoria na planilha</div>
    <div class="leg" style="gap:8px">
      <div style="width:24px;height:3px;background:var(--red);border-top:2px dashed var(--red);border-bottom:none;flex-shrink:0"></div>
      <span><strong style="color:var(--red)">Linha pontilhada vermelha</strong> = Meta. Quando a meta muda, a linha sobe/desce a partir da semana X preservando o histórico anterior.</span>
    </div>
  </div>

  <div class="info-box">
    <strong>Critério de mapeamento:</strong> Apenas indicadores que existem exatamente em
    TO DO &amp; PLANNING / Metas &amp; Indicadores (tabela <code>indicadores</code> no banco DEV) foram marcados como monitorados.
    Nenhum proxy de Kanban, Sirene, rede_franqueados ou indicador qualitativo (OK/NOK) foi considerado.<br>
    <strong>Preenchimento:</strong> todos os indicadores monitorados são inseridos manualmente pelo responsável da área toda semana em <em>Metas &amp; Indicadores</em>.
  </div>

  ${cardsH}`;
}

/* ── CHARTS (meta = linha vermelha stepped) ──────────────────────────────── */
function initCharts(){
  document.querySelectorAll('canvas[data-values]').forEach(canvas=>{
    const vals = JSON.parse(canvas.dataset.values);
    const meta = JSON.parse(canvas.dataset.meta);
    new Chart(canvas, {
      type:'line',
      data:{
        labels: SEMS,
        datasets:[
          {
            data: vals,
            borderColor: 'var(--navy)',
            backgroundColor: 'rgba(12,38,51,0.05)',
            borderWidth: 2,
            pointRadius: 3,
            pointHoverRadius: 5,
            tension: 0.35,
            fill: true,
            label: 'Realizado',
          },
          {
            data: meta,
            borderColor: '#c0392b',
            borderWidth: 1.5,
            borderDash: [5,3],
            pointRadius: 0,
            pointHoverRadius: 4,
            fill: false,
            stepped: true,   /* linha em degrau — preserva histórico visualmente */
            label: 'Meta',
          },
        ],
      },
      options:{
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins:{
          legend:{
            display: true,
            position: 'bottom',
            labels:{ boxWidth:10, font:{size:8}, padding:5, color:'#999' },
          },
          tooltip:{
            mode:'index', intersect:false,
            callbacks:{
              label: i=>`${i.dataset.label}: ${i.raw}`,
            },
          },
        },
        scales:{
          x:{ display:true, ticks:{font:{size:8},color:'#bbb',maxRotation:0}, grid:{display:false} },
          y:{ display:true, ticks:{font:{size:8},color:'#bbb',maxTicksLimit:3}, grid:{color:'rgba(0,0,0,0.04)'} },
        },
      },
    });
  });
}

/* ── SCROLL SPY ──────────────────────────────────────────────────────────── */
function initSpy(){
  const obs = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const id=e.target.id.replace('dep-','');
        document.querySelectorAll('.sidebar a').forEach(a=>{
          a.classList.toggle('active', a.dataset.id===id);
        });
      }
    });
  },{threshold:0.12, rootMargin:'-48px 0px -55% 0px'});
  document.querySelectorAll('.depto').forEach(el=>obs.observe(el));
}

/* ── BOOT ─────────────────────────────────────────────────────────────────── */
renderSidebar();
renderMain();
window.addEventListener('load',()=>{ initCharts(); initSpy(); });
</script>
